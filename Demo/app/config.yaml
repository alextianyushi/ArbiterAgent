# Database Configuration
database:
  default:
    dialect: sqlite
    driver: sqlite
    sqlite_dir: data
  mysql:
    dialect: mysql
    driver: mysqldb
    host: localhost
    port: 3306
    charset: utf8mb4
  postgresql:
    dialect: postgresql
    driver: psycopg2
    host: localhost
    port: 5432

# Logging Configuration
logging:
  default:
    level: INFO
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
    log_dir: logs
    max_bytes: 10485760  # 10MB
    backup_count: 5
  production:
    level: WARNING
    format: '%(asctime)s - %(levelname)s - %(message)s'
    log_dir: /var/log/app
    max_bytes: 52428800  # 50MB
    backup_count: 10

# Third Party Library Log Levels
third_party_logging:
  httpx: WARNING
  sqlalchemy: WARNING 